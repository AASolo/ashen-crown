<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0709" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Ashen Crown: Пепельный Венец</title>
  <meta name="description" content="Изометрическая тёмно-фэнтезийная ARPG в браузере: лагерь выживших, подземелья Разлома, боссы, лут и стройка. Играть прямо на телефоне или ПК." />
  <!-- превью ссылки в мессенджерах и соцсетях -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Ashen Crown" />
  <meta property="og:title" content="Ashen Crown: Пепельный Венец" />
  <meta property="og:description" content="Изометрическая тёмно-фэнтезийная ARPG в браузере: лагерь выживших, подземелья Разлома, боссы, лут и стройка. Играть прямо на телефоне или ПК." />
  <meta property="og:url" content="https://aasolo.github.io/ashen-crown/" />
  <meta property="og:image" content="https://aasolo.github.io/ashen-crown/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="ru_RU" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://aasolo.github.io/ashen-crown/og.jpg" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #070506; overflow: hidden; touch-action: none; }
    body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #game { position: fixed; inset: 0; }
    #game canvas { display: block; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #b8a58a;
            font: 18px Georgia, 'Times New Roman', serif; letter-spacing: .2em; }
  </style>
</head>
<body>
  <div id="boot">ПЕПЕЛ ОСЕДАЕТ…</div>
  <script>
    // Если игра не запустилась, вместо чёрного экрана показываем причину (для отладки на телефонах).
    (function () {
      var lines = [];
      function show(m) {
        var b = document.getElementById('boot');
        if (!b) { b = document.createElement('div'); b.id = 'boot'; document.body.appendChild(b); }
        lines.push(m);
        b.style.cssText += ';z-index:9;font:13px/1.4 monospace;letter-spacing:0;padding:16px;white-space:pre-wrap;place-items:center start;background:#070506';
        b.textContent = 'Игра не запустилась:\n\n' + lines.join('\n') + '\n\n' + navigator.userAgent;
      }
      addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && (t.src || t.href)) show('не загрузился файл: ' + (t.src || t.href));
        else show((e.message || 'ошибка') + (e.filename ? '\n  ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
      }, true);
      addEventListener('unhandledrejection', function (e) {
        var r = e.reason; show('promise: ' + (r && (r.message || r) || '?'));
      });
      // потеря WebGL (обычно нехватка памяти на телефоне) — тоже на экран
      var lost = false;
      addEventListener('webglcontextlost', function () { lost = true; show('WebGL-контекст потерян (не хватило видеопамяти?)'); }, true);
      // через 25 с без меню — сообщаем, что видно изнутри, даже если ошибок не было
      setTimeout(function () {
        var g = window.__game;
        if (g && g.scene && (g.scene.isActive('Menu') || g.scene.isActive('Game'))) return;
        var info = 'нет меню через 25 с; Phaser: ' + (g ? 'создан' : 'не создан');
        if (g && g.scene) {
          info += '\nсцены: ' + g.scene.getScenes(true).map(function (x) { return x.sys.settings.key; }).join(', ');
          var bs = g.scene.getScene('Boot'), ld = bs && bs.load;
          if (ld) info += '\nзагрузка: ' + Math.round(ld.progress * 100) + '%, файлов осталось ' + ld.list.size + ', грузятся ' + ld.inflight.size + ', ошибок ' + ld.totalFailed;
          if (g.renderer) info += '\nрендер: ' + (g.renderer.type === 2 ? 'WebGL' : 'Canvas') + ' ' + g.canvas.width + '×' + g.canvas.height;
        }
        if (lost) info += '\nконтекст WebGL потерян';
        show(info);
      }, 25000);
    })();
  </script>
  <div id="game"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
